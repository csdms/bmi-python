name: Test

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish_to:
        description: Where to publish
        type: choice
        required: true
        default: none
        options:
          - none
          - testpypi
          - pypi

jobs:
  build:
    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name !=
      github.repository

    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Build sdist
        run: |
          pip install nox
          nox -s build

      - uses: actions/upload-artifact@v6
        with:
          name: build-dist
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error

  test:
    needs: [build]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: build-dist
          path: ${{ github.workspace }}/dist

      - name: Test
        run: |
          pip install --upgrade pip
          pip install nox
          nox -s test -- dist/*.whl

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  tests-passed:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "One or more tests failed: $RESULT"
            exit 1
          fi
          echo "All tests passed."

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to != 'none'
    env:
      REPOSITORY_URL: ${{ inputs.publish_to == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: ${{ github.workspace }}/dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ env.REPOSITORY_URL }}
          packages-dir: dist
          skip-existing: true
          print-hash: true
          verify-metadata: false
