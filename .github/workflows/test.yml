name: Test

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to:
        description: Where to publish
        type: choice
        required: true
        default: none
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install nox
          nox -s build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build-dist
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error

  test:
    needs: [build]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: build-dist
          path: ${{ github.workspace }}/dist

      - name: Test
        run: |
          python -m pip install nox
          nox -s test -- dist/*.whl

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  tests-passed:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Checks did not succeed: test=$RESULT"
            exit 1
          fi
          echo "All tests passed."

  publish:
    needs: [tests-passed]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to != 'none'
    env:
      REPOSITORY_URL: ${{ inputs.publish_to == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: ${{ github.workspace }}/dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: ${{ env.REPOSITORY_URL }}
          packages-dir: dist
          skip-existing: false
          print-hash: true
